<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDIA CORE COMPANY | Chat Assistant</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f7;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .chat-container {
    width: 420px;
    max-width: 95vw;
    height: 620px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: #0b3d91;
    color: #ffffff;
    padding: 16px;
    text-align: center;
  }

  .chat-header h1 {
    margin: 0;
    font-size: 18px;
  }

  .chat-header p {
    margin: 4px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .message.user {
    align-self: flex-end;
    background: #0b3d91;
    color: #ffffff;
    border-bottom-right-radius: 2px;
  }

  .message.bot {
    align-self: flex-start;
    background: #eef1f6;
    color: #222222;
    border-bottom-left-radius: 2px;
  }

  .message.typing {
    font-style: italic;
    opacity: 0.7;
  }

  .chat-input {
    display: flex;
    border-top: 1px solid #e0e0e0;
    padding: 10px;
    gap: 8px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
  }

  .chat-input button {
    background: #0b3d91;
    color: #ffffff;
    border: none;
    padding: 0 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
  }

  .chat-input button:hover {
    background: #092d6e;
  }

  .chat-input button:disabled {
    background: #9aa7c7;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>INDIA CORE COMPANY</h1>
      <p>Ask me anything about INDIA CORE COMPANY</p>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        Hello! I am the INDIA CORE Assistant. Ask me anything about INDIA CORE COMPANY.
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.textContent = text;
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msg;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;

    const typingMsg = addMessage("Typing...", "bot typing");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      typingMsg.remove();
      addMessage(data.reply, "bot");
    } catch (err) {
      typingMsg.remove();
      addMessage("Network error. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
